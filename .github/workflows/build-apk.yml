name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'buildozer.spec'
      - 'app_icon.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache Buildozer and Android toolchains to reduce repeated downloads.
      - name: Cache Buildozer and Android toolchains
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Build APK (retry transient download failures)
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if buildozer android debug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Build failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "Build failed after 3 attempts. Review the build error above."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Studio-debug-APK
          path: bin/*.apk
          if-no-files-found: error
